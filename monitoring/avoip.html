<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shek Mun AV Monitoring - AVoIP</title>
<style>
  :root {
    --bg: #1e1e2e; --panel: #313244; --panel2: #45475a;
    --text: #cdd6f4; --muted: #a6adc8; --accent: #89b4fa;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg); color: var(--text);
    margin: 0; padding: 16px;
  }
  nav.tabs {
    display: flex; gap: 6px; background: var(--panel);
    border-radius: 8px 8px 0 0; padding: 8px 12px 0; margin-bottom: 12px;
    flex-wrap: wrap;
  }
  nav.tabs a {
    color: var(--muted); text-decoration: none; font-size: 14px; font-weight: bold;
    padding: 7px 18px; border-radius: 8px 8px 0 0;
  }
  nav.tabs a:hover { color: var(--text); background: var(--panel2); }
  nav.tabs a.active { color: #11111b; background: var(--accent); }
  h1 { font-size: 18px; margin: 0 0 8px; }
  #meta { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .rooms { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 1400px) { .rooms { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 900px) { .rooms { grid-template-columns: 1fr; } }
  .room {
    background: var(--panel); border-radius: 8px; padding: 10px 12px;
    border-left: 4px solid var(--accent);
  }
  .room h2 { font-size: 14px; margin: 0 0 8px; text-align: center; }
  .rowhead {
    text-align: center; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px;
    margin: 6px 0 4px;
  }
  .row { display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; }
  .row-many .cell { width: 18%; flex: 0 0 18%; max-width: 200px; }
  .cell {
    position: relative; border-radius: 6px; overflow: hidden;
    background: var(--panel2); aspect-ratio: 16/9;
    width: 28%; flex: 0 0 28%; max-width: 280px;
    display: flex; align-items: center; justify-content: center;
  }
  .cell img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .cell .cap {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.65); color: #fff; font-size: 10px;
    padding: 2px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-align: center;
  }
  .cell .fb { display: none; color: var(--muted); font-size: 11px; text-align: center; padding: 4px; }
  .cell.err img { display: none; }
  .cell.err .fb { display: block; }
  .empty { color: var(--muted); font-size: 12px; padding: 8px 2px; text-align: center; }
</style>
</head>
<body>
<nav class="tabs">

const $rooms = document.getElementById('rooms');
let tick = Date.now();
let cells = [];   // {img, next} per cell - staggered refresh to avoid bursts

function buildRooms() {
  $rooms.innerHTML = '';
  ROOMS.forEach(room => {
    const div = document.createElement('div');
    div.className = 'room';
    const layout = LAYOUTS[room] || null;
    div.innerHTML = '<h2>' + room + '</h2>';
    if (layout) {
      layout.forEach(group => {
        const rh = document.createElement('div');
        rh.className = 'rowhead';
        rh.textContent = group.legend;
        div.appendChild(rh);
        const row = document.createElement('div');
        row.className = 'row' + (group.items.length >= 4 ? ' row-many' : '');
        group.items.forEach(snap => {
          const cell = document.createElement('div');
          cell.className = 'cell';
          if (snap.url) {
            cell.innerHTML = '<img data-src="' + snap.url + '" alt="' + snap.cap + '" onerror="this.parentElement.classList.add(\'err\')">' +
              '<span class="cap">' + snap.cap + '</span>' +
              '<span class="fb">' + snap.cap + ' unavailable</span>';
          } else {
            cell.innerHTML = '<span style="color:var(--muted);font-size:11px;text-align:center;padding:4px;">' + snap.cap + '<br>(URL missing)</span>';
          }
          row.appendChild(cell);
        });
        div.appendChild(row);
      });
    } else {
      const e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'No AVoIP snapshot layout configured for this room.';
      div.appendChild(e);
    }
    $rooms.appendChild(div);
  });
  cells = [];
  document.querySelectorAll('.cell img').forEach((img, i) => {
    cells.push({ img: img, next: Date.now() + i * 120 });
  });
  refreshImages();
}

function refreshImages() {
  const now = Date.now();
  cells.forEach(c => {
    if (now < c.next) return;
    const isErr = c.img.classList.contains('err');
    c.next = now + (isErr ? 1500 : REFRESH_MS) + Math.random() * 200;
    c.img.parentElement.classList.remove('err');
    c.img.src = c.img.dataset.src + '?t=' + now;
  });
}

buildRooms();
setInterval(refreshImages, 250);
</script>
