<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shek Mun AV Monitoring Dashboard</title>
<style>
  :root {
    --bg: #1e1e2e; --panel: #313244; --panel2: #45475a;
    --text: #cdd6f4; --muted: #a6adc8;
    --ok: #a6e3a1; --fail: #f38ba8; --unknown: #6c7086;
    --accent: #89b4fa;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg); color: var(--text);
    margin: 0; padding: 16px;
  }
  header { margin-bottom: 10px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  #meta { color: var(--muted); font-size: 13px; }
  #meta b { color: var(--text); }
  #error {
    display: none; background: #3a1d24; border: 1px solid var(--fail);
    color: var(--fail); padding: 8px 12px; border-radius: 6px; margin-bottom: 12px;
  }

  /* toolbar */
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    background: var(--panel); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px;
    font-size: 13px;
  }
  .chips { display: flex; gap: 6px; }
  .chip {
    background: var(--panel2); color: var(--text); border: none;
    border-radius: 14px; padding: 4px 12px; cursor: pointer; font-size: 12px;
  }
  .chip:hover { filter: brightness(1.15); }
  .chip.active { background: var(--accent); color: #11111b; font-weight: bold; }
  .sort { margin-left: auto; display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .sort select {
    background: var(--panel2); color: var(--text); border: none;
    border-radius: 4px; padding: 4px 6px; font-size: 12px;
  }
  #summary { color: var(--muted); font-size: 12px; }
  .creds-link {
    background: var(--panel2); color: var(--accent); text-decoration: none;
    border-radius: 14px; padding: 4px 12px; font-size: 12px; font-weight: bold;
  }
  .creds-link:hover { filter: brightness(1.15); text-decoration: underline; }

  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 1500px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 1100px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
  .room {
    background: var(--panel); border-radius: 8px; padding: 10px 12px;
    border-left: 4px solid var(--unknown);
  }
  .room.room-ok { border-left-color: var(--ok); }
  .room.room-fail { border-left-color: var(--fail); }
  .room h2 { font-size: 14px; margin: 0 0 8px; display: flex; justify-content: space-between; }
  .room .counts { color: var(--muted); font-weight: normal; font-size: 12px; }
  .cam {
    width: 96px; height: 54px; object-fit: cover; border-radius: 4px;
    border: 1px solid var(--panel2); vertical-align: middle; margin-left: 10px;
    background: var(--panel2);
  }
  .cam-wrap:hover .cam { border-color: var(--accent); }
  .group-head {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--muted); margin: 6px 0 2px; padding-top: 6px; border-top: 1px dashed #3a3b4d;
  }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td { padding: 2px 4px; white-space: nowrap; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .dot.ok { background: var(--ok); }
  .dot.fail { background: var(--fail); }
  .dot.unknown { background: var(--unknown); }
  .dev-name { max-width: 230px; overflow: hidden; text-overflow: ellipsis; }
  a.dev-link {
    color: var(--accent); text-decoration: none;
    display: inline-block; max-width: 230px;
    overflow: hidden; text-overflow: ellipsis; vertical-align: bottom;
  }
  a.dev-link:hover { text-decoration: underline; }
  .temp { margin-left: 8px; font-size: 11px; font-weight: bold; }
  .temp.t-ok { color: var(--ok); }
  .temp.t-hot { color: var(--fail); }
  .temp .temp-time { color: var(--muted); font-weight: normal; font-size: 10px; margin-left: 4px; }
  .rtt { color: var(--muted); text-align: right; }
  .when { color: var(--muted); text-align: right; font-size: 11px; }
  .empty { color: var(--muted); font-size: 12px; padding: 6px 2px; }
  #unique { margin-top: 14px; max-width: 480px; }
  .footer { margin-top: 14px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Shek Mun AV Monitoring Dashboard</h1>
  <div id="meta">Loading snapshot...</div>
</header>
<div id="error">Cannot reach snapshot.json - is the monitoring server running?</div>

<div class="toolbar">
  <div class="chips" id="groupChips">
    <button class="chip active" data-g="__all__">All</button>
    <button class="chip" data-g="Video">Video</button>
    <button class="chip" data-g="Audio">Audio</button>
    <button class="chip" data-g="Control">Control</button>
  </div>
  <div class="sort">
    <label for="sortSel">Sort:</label>
    <select id="sortSel">
      <option value="group">By Group</option>
      <option value="name">By Name</option>
      <option value="status">Status (failures first)</option>
    </select>
  </div>
  <a class="creds-link" href="creds.html">Device passwords &rarr;</a>
  <div id="summary"></div>
</div>

<div id="rooms" class="grid"></div>
<div id="unique"></div>
<div class="footer">Auto-refresh every 10 seconds &middot; serve with: powershell -File serve-dashboard.ps1</div>

<script>
const REFRESH_MS = 10000;

// role -> group mapping
const GROUPS = {
  'control': 'Control', 'switch': 'Control',
  'dante': 'Audio', 'audio': 'Audio',
  'display': 'Video', 'camera': 'Video', 'media': 'Video', 'avoip': 'Video'
};
const GROUP_ORDER = ['Video', 'Audio', 'Control'];
const STATUS_ORDER = { 'fail': 0, 'unknown': 1, 'ok': 2 };

// thumbnail toggles (set CAM_ENABLED to true to turn back on)
const CAM_ENABLED = false;
// per-room overrides; rooms listed here stay hidden even when enabled
const CAM_DISABLED_ROOMS = [];

const $rooms = document.getElementById('rooms');
const $unique = document.getElementById('unique');
const $meta = document.getElementById('meta');
const $error = document.getElementById('error');
const $summary = document.getElementById('summary');
const $chips = document.getElementById('groupChips');
const $sortSel = document.getElementById('sortSel');
const $countdown = document.createElement('span');
$countdown.id = 'countdown';
$countdown.style.cssText = 'color:var(--accent);margin-left:10px;';
$meta.appendChild($countdown);

let activeGroups = null;            // null = all
let lastLoaded = 0;
let camTick = Date.now();           // cache-buster for mediabox snapshots

function fmt(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  const today = new Date().toDateString() === d.toDateString();
  const time = d.toLocaleTimeString();
  return today ? time : d.toLocaleDateString() + ' ' + time;
}

function groupOf(d) { return GROUPS[d.role] || 'Control'; }

const EXCLUDED = /TV-Res/;
function isExcluded(d) { return EXCLUDED.test(d.name); }

function sortDevices(list) {
  const mode = $sortSel.value;
  const arr = list.slice();
  if (mode === 'group') {
    arr.sort((a, b) => (GROUP_ORDER.indexOf(groupOf(a)) - GROUP_ORDER.indexOf(groupOf(b))) || a.name.localeCompare(b.name));
  } else if (mode === 'name') {
    arr.sort((a, b) => a.name.localeCompare(b.name));
  } else {
    arr.sort((a, b) => (STATUS_ORDER[a.status] - STATUS_ORDER[b.status]) || a.name.localeCompare(b.name));
  }
  return arr;
}

function visibleDevices(list) {
  const all = sortDevices(list.filter(d => !isExcluded(d)));
  if (!activeGroups) return all;
  return all.filter(d => activeGroups.has(groupOf(d)));
}

function deviceRow(d) {
  const tr = document.createElement('tr');
  const tempHtml = (typeof d.tempC === 'number')
    ? '<span class="temp ' + (d.tempC < 45 ? 't-ok' : 't-hot') + '" title="KDS unit temperature, updated ' + fmt(d.tempAt) + '">' + d.tempC + '&deg;C<span class="temp-time">' + fmt(d.tempAt) + '</span></span>'
    : '';
  tr.innerHTML =
    '<td><span class="dot ' + d.status + '"></span><a class="dev-link" href="http://' + d.ip + '" target="_blank" title="' + d.ip + ' [' + groupOf(d) + '] - click to open http://' + d.ip + '">' + d.name + ' (IP:' + d.ip + ')</a>' + tempHtml + '</td>' +
    '<td class="rtt">' + (d.rttMs >= 0 ? d.rttMs + ' ms' : '&ndash;') + '</td>' +
    '<td class="when" title="' + d.name + '">' + fmt(d.checkedAt) + '</td>';
  return tr;
}

function deviceTable(devices) {
  const table = document.createElement('table');
  if (devices.length === 0) {
    table.innerHTML = '<tr><td class="empty">No devices in this view</td></tr>';
    return table;
  }
  if ($sortSel.value === 'group') {
    let lastGroup = null;
    devices.forEach(d => {
      const g = groupOf(d);
      if (g !== lastGroup) {
        const th = document.createElement('tr');
        th.innerHTML = '<td colspan="3" class="group-head">' + g + '</td>';
        table.appendChild(th);
        lastGroup = g;
      }
      table.appendChild(deviceRow(d));
    });
  } else {
    devices.forEach(d => table.appendChild(deviceRow(d)));
  }
  return table;
}

function roomBlock(title, allDevices) {
  const devices = visibleDevices(allDevices);
  const div = document.createElement('div');
  div.className = 'room';
  const shown = allDevices.filter(d => !isExcluded(d));
  const ok = shown.filter(d => d.status === 'ok').length;
  const fail = shown.filter(d => d.status === 'fail').length;
  const unk = shown.length - ok - fail;
  const mb = (!CAM_ENABLED || CAM_DISABLED_ROOMS.includes(title)) ? null : shown.find(d => /mediabox/i.test(d.name));
  const camHtml = mb
    ? '<a class="cam-wrap" href="http://' + mb.ip + '" target="_blank" title="MediaBox ' + mb.ip + '"><img class="cam" data-base="http://' + mb.ip + '/snapshot/snapshot" src="http://' + mb.ip + '/snapshot/snapshot?t=' + camTick + '" alt="MediaBox" onerror="this.style.display=\'none\'"></a>'
    : '';
  div.className += (fail > 0) ? ' room-fail' : (unk > 0 ? '' : ' room-ok');
  div.innerHTML =
    '<h2><span>' + title + camHtml + '</span><span class="counts">' +
    ok + ' ok / ' + fail + ' fail' + (unk ? ' / ' + unk + ' unknown' : '') + '</span></h2>';
  div.appendChild(deviceTable(devices));
  return div;
}

function render(snap) {
  $rooms.innerHTML = '';
  let visible = 0, total = 0, ok = 0, fail = 0, excluded = 0;
  for (const room of Object.keys(snap.rooms || {})) {
    const roomDevices = snap.rooms[room];
    total += roomDevices.filter(d => !isExcluded(d)).length;
    excluded += roomDevices.filter(isExcluded).length;
    const shown = visibleDevices(roomDevices).length;
    visible += shown;
    ok += roomDevices.filter(d => d.status === 'ok' && !isExcluded(d)).length;
    fail += roomDevices.filter(d => d.status === 'fail' && !isExcluded(d)).length;
    $rooms.appendChild(roomBlock(room, roomDevices));
  }
  if (snap.unique && snap.unique.length) {
    total += snap.unique.filter(d => !isExcluded(d)).length;
    excluded += snap.unique.filter(isExcluded).length;
    visible += visibleDevices(snap.unique).length;
    ok += snap.unique.filter(d => d.status === 'ok' && !isExcluded(d)).length;
    fail += snap.unique.filter(d => d.status === 'fail' && !isExcluded(d)).length;
    $unique.innerHTML = '';
    $unique.appendChild(roomBlock('Shared / Unique', snap.unique));
  } else {
    $unique.innerHTML = '';
  }
  $summary.textContent = 'Showing ' + visible + ' / ' + total + ' devices · ' + ok + ' ok · ' + fail + ' fail' + (excluded ? ' · ' + excluded + ' excluded (TV-Res)' : '');
}

async function load() {
  try {
    const r = await fetch('snapshot.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const snap = await r.json();
    $error.style.display = 'none';
    $meta.innerHTML =
      'Page updated: <b>' + new Date().toLocaleTimeString() + '</b>' +
      ' &middot; Snapshot updated: <b>' + fmt(snap.updatedAt) + '</b>' +
      ' &middot; Snapshot generated: ' + fmt(snap.generatedAt) +
      ' &middot; KDS temps updated: <b>' + (snap.tempUpdatedAt ? fmt(snap.tempUpdatedAt) : 'n/a') + '</b>';
    document.title = 'Shek Mun AV Monitoring (' + fmt(snap.updatedAt) + ')';
    lastLoaded = Date.now();
    render(snap);
  } catch (e) {
    $error.style.display = 'block';
    $meta.innerHTML = 'Last successful load: ' + new Date().toLocaleTimeString() + ' - ' + e.message;
  }
}

// group filter chips: All resets; group chips toggle individually
$chips.addEventListener('click', (e) => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  const g = btn.dataset.g;
  if (g === '__all__') {
    activeGroups = null;
    $chips.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === btn));
  } else {
    if (!activeGroups) activeGroups = new Set();
    if (activeGroups.has(g)) { activeGroups.delete(g); btn.classList.remove('active'); }
    else { activeGroups.add(g); btn.classList.add('active'); }
    if (activeGroups.size === 0) activeGroups = null;
    const allChip = $chips.querySelector('.chip[data-g="__all__"]');
    allChip.classList.toggle('active', activeGroups === null);
  }
  renderLast();
});

$sortSel.addEventListener('change', renderLast);

let lastSnap = null;
function renderLast() { if (lastSnap) render(lastSnap); }

load();
setInterval(load, REFRESH_MS);

setInterval(() => {
  const rem = Math.max(0, Math.ceil((lastLoaded + REFRESH_MS - Date.now()) / 1000));
  $countdown.textContent = 'Refresh in ' + rem + 's';
}, 250);

// refresh mediabox thumbnails every 0.1s (independent of page refresh)
setInterval(() => {
  camTick = Date.now();
  document.querySelectorAll('.cam').forEach(img => {
    img.style.display = '';
    img.src = img.dataset.base + '?t=' + camTick;
  });
}, 100);
</script>
</body>
</html>
