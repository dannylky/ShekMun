<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shek Mun AV Monitoring - PTZ</title>
<style>
  :root {
    --bg: #1e1e2e; --panel: #313244; --panel2: #45475a;
    --text: #cdd6f4; --muted: #a6adc8; --accent: #89b4fa;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg); color: var(--text);
    margin: 0; padding: 16px;
  }
  nav.tabs {
    display: flex; gap: 6px; background: var(--panel);
    border-radius: 8px 8px 0 0; padding: 8px 12px 0; margin-bottom: 12px;
  }
  nav.tabs a {
    color: var(--muted); text-decoration: none; font-size: 14px; font-weight: bold;
    padding: 7px 18px; border-radius: 8px 8px 0 0;
  }
  nav.tabs a:hover { color: var(--text); background: var(--panel2); }
  nav.tabs a.active { color: #11111b; background: var(--accent); }
  iframe {
    width: 100%; height: calc(100vh - 110px); min-height: 320px;
    border: 1px solid var(--panel2); border-radius: 8px; background: var(--panel);
  }
  .gate {
    display: none; position: fixed; inset: 0; z-index: 999;
    background: var(--bg); align-items: center; justify-content: center;
    flex-direction: column; gap: 12px;
  }
  .gate .card {
    background: var(--panel); border-radius: 10px; padding: 24px 28px;
    border-left: 4px solid var(--accent); text-align: center;
  }
  .gate h2 { margin: 0 0 14px; font-size: 16px; }
  .gate input {
    background: var(--panel2); color: var(--text); border: 1px solid var(--panel2);
    border-radius: 6px; padding: 8px 12px; font-size: 14px; width: 200px; text-align: center;
    margin-bottom: 8px;
  }
  .gate button {
    background: var(--accent); color: #11111b; border: none; border-radius: 6px;
    padding: 8px 20px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 12px;
  }
  .gate .err { color: var(--fail); font-size: 12px; margin-top: 8px; min-height: 16px; }
  .gate .hint { color: var(--muted); font-size: 11px; margin-top: 10px; }
  .gate .chglink { margin-top: 8px; font-size: 12px; }
  .gate .chglink a { color: var(--accent); text-decoration: none; }
  .gate .chglink a:hover { text-decoration: underline; }
</style>
</head>
<body>
<nav class="tabs">
  <a href="dashboard_shekmun.html">Main</a>
  <a href="dashboard.html">Dashboard</a>
  <a href="ptc.html" class="active">PTZ</a>
  <a href="avoip.html">AVoIP</a>
  <a href="ops-guide.html">Operation Guide</a>
  <a href="case-followup.html">Case Follow Up</a>
  <a href="spare-equipment.html">Spare equipment</a>
  <a href="enhancement.html">Enhancements/Known issues</a>
  <a href="creds.html">Passwords</a>
  <a href="user-admin.html" style="display:none">User admin</a>
</nav>
<iframe id="ptc" src="dashboard_PTZ.html" title="PTZ main page"></iframe>
<div class="footer" style="color:var(--muted);font-size:12px;margin-top:12px;">v1.9.15</div>

<div class="gate" id="gate">
  <div class="card">
    <h2 id="gateTitle">Restricted - please sign in</h2>
    <input type="text" id="gateUser" placeholder="Login name" autocomplete="username">
    <input type="password" id="gatePw" placeholder="Password" autocomplete="current-password">
    <input type="password" id="gateNewPw" placeholder="New password" autocomplete="new-password" style="display:none">
    <input type="password" id="gateNewPw2" placeholder="Confirm new password" autocomplete="new-password" style="display:none">
    <div><button id="gateBtn">Sign in</button> <button id="gateBack" style="background:var(--panel2);color:var(--text);">Back</button></div>
    <div class="err" id="gateErr"></div>
    <div class="hint" id="gateHint">Support group: 05:00-09:00 &middot; Admin group: all day</div>
    <div class="chglink"><a href="#" id="gateChgLink">Change password</a></div>
  </div>
</div>

<script>
(function () {
  const host = location.hostname;
  const local = host === 'localhost' || host === '127.0.0.1' || host === '::1' || host === '[::1]';
  if (local) return;
  const gate = document.getElementById('gate');
  const userEl = document.getElementById('gateUser');
  const pw = document.getElementById('gatePw');
  const err = document.getElementById('gateErr');
  const gateBtn = document.getElementById('gateBtn');
  const gateTitle = document.getElementById('gateTitle');
  const newPw1 = document.getElementById('gateNewPw');
  const newPw2 = document.getElementById('gateNewPw2');
  const chgLink = document.getElementById('gateChgLink');
  let chgMode = false;
  const SESSION_KEY = 'shekmunSession';
  const REMEMBER_KEY = 'shekmunRememberUser';

  function allowedNow() {
    const h = new Date().getHours();
    return h >= 5 && h < 9;   // 05:00-08:59:59
  }
  function getSession() { try { return JSON.parse(sessionStorage.getItem(SESSION_KEY)); } catch (e) { return null; } }
  function setSession(u) { sessionStorage.setItem(SESSION_KEY, JSON.stringify({ name: u.name, group: u.group, at: Date.now() })); }
  function clearSession() { sessionStorage.removeItem(SESSION_KEY); }

  // Support sessions are re-checked every 5 minutes; kicked to login when the window passes
  function checkWindow() {
    const s = getSession();
    if (s && s.group === 'support' && !allowedNow()) {
      clearSession();
      location.reload();
    }
  }
  function startWindowCheck() { checkWindow(); setInterval(checkWindow, 300000); }
  window.__shekMunWindowCheck = checkWindow;   // exposed for testing

  const session = getSession();
  if (session) {
    if (session.group === 'admin') return;             // full access - no checks
    if (allowedNow()) { startWindowCheck(); return; }  // support in window
    clearSession();                                    // window passed - back to login
  }

  gate.style.display = 'flex';
  userEl.value = localStorage.getItem(REMEMBER_KEY) || '';
  userEl.focus();

  async function tryLogin() {
    const name = userEl.value.trim();
    const pass = pw.value;
    if (!name || !pass) { err.textContent = 'Enter login name and password'; return; }
    let users;
    try {
      const r = await fetch('users.json?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      users = await r.json();
    } catch (e) { err.textContent = 'Cannot reach user database'; return; }
    const user = users.find(u => u.name === name && u.password === pass);
    if (!user) { err.textContent = 'Wrong login name or password'; pw.value = ''; pw.focus(); return; }
    localStorage.setItem(REMEMBER_KEY, name);          // remember name only - never the password
    if (user.group === 'support' && !allowedNow()) {
      err.textContent = 'Support group access is 05:00-09:00 only';
      pw.value = '';
      pw.focus();
      return;
    }
    setSession(user);
    gate.style.display = 'none';
    if (user.group === 'support') startWindowCheck();
  }

  function setMode(change) {
    chgMode = change;
    newPw1.style.display = change ? '' : 'none';
    newPw2.style.display = change ? '' : 'none';
    gateBtn.textContent = change ? 'Update password' : 'Sign in';
    chgLink.textContent = change ? 'Back to sign in' : 'Change password';
    gateTitle.textContent = change ? 'Change your password' : 'Restricted - please sign in';
    err.textContent = '';
    if (change) { newPw1.focus(); } else { userEl.focus(); }
  }

  async function changePassword() {
    const name = userEl.value.trim();
    const cur = pw.value;
    const n1 = newPw1.value;
    const n2 = newPw2.value;
    if (!name || !cur) { err.textContent = 'Enter login name and current password'; return; }
    if (n1.length < 6) { err.textContent = 'New password must be at least 6 characters'; return; }
    if (n1 !== n2) { err.textContent = 'New passwords do not match'; return; }
    let users;
    try {
      const r = await fetch('users.json?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      users = await r.json();
    } catch (e) { err.textContent = 'Cannot reach user database'; return; }
    const user = users.find(u => u.name === name && u.password === cur);
    if (!user) { err.textContent = 'Wrong login name or password'; pw.value = ''; pw.focus(); return; }
    user.password = n1;
    try {
      const r = await fetch('users.json', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=utf-8' },
        body: JSON.stringify(users)
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
    } catch (e) { err.textContent = 'Save failed - ' + e.message; return; }
    err.textContent = 'Password updated - please sign in with your new password';
    pw.value = '';
    newPw1.value = '';
    newPw2.value = '';
    setMode(false);
  }

  document.getElementById('gateBtn').addEventListener('click', function () {
    if (chgMode) { changePassword(); } else { tryLogin(); }
  });
  chgLink.addEventListener('click', function (e) {
    e.preventDefault();
    setMode(!chgMode);
  });
  document.getElementById('gateBack').addEventListener('click', function () {
    if (history.length > 1) history.back();
    else window.location.href = 'dashboard_shekmun.html';
  });
  userEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') { if (chgMode) { changePassword(); } else { tryLogin(); } } });
  pw.addEventListener('keydown', function (e) { if (e.key === 'Enter') { if (chgMode) { changePassword(); } else { tryLogin(); } } });
  newPw2.addEventListener('keydown', function (e) { if (e.key === 'Enter') changePassword(); });
})();

// remote mode: Passwords + User admin tabs are localhost-only
(function () {
  const host = location.hostname;
  const local = host === 'localhost' || host === '127.0.0.1' || host === '::1' || host === '[::1]';
  const lock = '\uD83D\uDD12';
  if (local) {
    const ua = document.querySelector('a[href="user-admin.html"]');
    if (ua) ua.style.display = '';
    return;
  }
  const l = document.querySelector('a[href="creds.html"]');
  if (l) l.remove();
  ['ptc.html', 'avoip.html'].forEach(function (href) {
    const a = document.querySelector('a[href="' + href + '"]');
    if (a && a.textContent.indexOf(lock) === -1) a.textContent = lock + ' ' + a.textContent;
  });
})();
</script>
</body>
</html>
