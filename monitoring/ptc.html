<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shek Mun AV Monitoring - PTZ</title>
<style>
  :root {
    --bg: #1e1e2e; --panel: #313244; --panel2: #45475a;
    --text: #cdd6f4; --muted: #a6adc8; --accent: #89b4fa;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg); color: var(--text);
    margin: 0; padding: 16px;
  }
  nav.tabs {
    display: flex; gap: 6px; background: var(--panel);
    border-radius: 8px 8px 0 0; padding: 8px 12px 0; margin-bottom: 12px;
  }
  nav.tabs a {
    color: var(--muted); text-decoration: none; font-size: 14px; font-weight: bold;
    padding: 7px 18px; border-radius: 8px 8px 0 0;
  }
  nav.tabs a:hover { color: var(--text); background: var(--panel2); }
  nav.tabs a.active { color: #11111b; background: var(--accent); }
  iframe {
    width: 100%; height: calc(100vh - 110px); min-height: 320px;
    border: 1px solid var(--panel2); border-radius: 8px; background: var(--panel);
  }
  .gate {
    display: none; position: fixed; inset: 0; z-index: 999;
    background: var(--bg); align-items: center; justify-content: center;
    flex-direction: column; gap: 12px;
  }
  .gate .card {
    background: var(--panel); border-radius: 10px; padding: 24px 28px;
    border-left: 4px solid var(--accent); text-align: center;
  }
  .gate h2 { margin: 0 0 14px; font-size: 16px; }
  .gate input {
    background: var(--panel2); color: var(--text); border: 1px solid var(--panel2);
    border-radius: 6px; padding: 8px 12px; font-size: 14px; width: 200px; text-align: center;
  }
  .gate button {
    background: var(--accent); color: #11111b; border: none; border-radius: 6px;
    padding: 8px 20px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 12px;
  }
  .gate .err { color: var(--fail); font-size: 12px; margin-top: 8px; min-height: 16px; }
</style>
</head>
<body>
<nav class="tabs">
  <a href="dashboard_shekmun.html">Main</a>
  <a href="dashboard.html">Dashboard</a>
  <a href="ptc.html" class="active">PTZ</a>
  <a href="avoip.html">AVoIP</a>
  <a href="ops-guide.html">Operation Guide</a>
  <a href="creds.html">Passwords</a>
</nav>
<iframe id="ptc" src="dashboard_PTZ.html" title="PTZ main page"></iframe>
<div class="footer" style="color:var(--muted);font-size:12px;margin-top:12px;">v1.9.1</div>

<div class="gate" id="gate">
  <div class="card">
    <h2>Restricted - enter password</h2>
    <input type="password" id="gatePw" placeholder="Password" autocomplete="off">
    <div><button id="gateBtn">Unlock</button> <button id="gateBack" style="background:var(--panel2);color:var(--text);">Back</button></div>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<script>
(function () {
  const host = location.hostname;
  const local = host === 'localhost' || host === '127.0.0.1';
  if (local || sessionStorage.getItem('shekmunGate') === '1') return;
  const gate = document.getElementById('gate');
  const pw = document.getElementById('gatePw');
  const err = document.getElementById('gateErr');
  gate.style.display = 'flex';
  pw.focus();
  const tryUnlock = function () {
    if (pw.value === 'rcteacher1') {
      sessionStorage.setItem('shekmunGate', '1');
      gate.style.display = 'none';
    } else {
      err.textContent = 'Wrong password';
      pw.value = '';
      pw.focus();
    }
  };
  document.getElementById('gateBtn').addEventListener('click', tryUnlock);
  document.getElementById('gateBack').addEventListener('click', function () {
    if (history.length > 1) history.back();
    else window.location.href = 'dashboard_shekmun.html';
  });
  pw.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryUnlock(); });
})();

// remote mode: hide Passwords tab, add lock symbol to PTZ/AVoIP tabs
(function () {
  const host = location.hostname;
  const local = host === 'localhost' || host === '127.0.0.1';
  const lock = '\uD83D\uDD12';
  if (local) return;
  const l = document.querySelector('a[href="creds.html"]');
  if (l) l.remove();
  ['ptc.html', 'avoip.html'].forEach(function (href) {
    const a = document.querySelector('a[href="' + href + '"]');
    if (a && a.textContent.indexOf(lock) === -1) a.textContent = lock + ' ' + a.textContent;
  });
})();
</script>
</body>
</html>
