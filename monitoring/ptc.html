<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shek Mun AV Monitoring - PTZ</title>
<style>
  :root {
    --bg: #1e1e2e; --panel: #313244; --panel2: #45475a;
    --text: #cdd6f4; --muted: #a6adc8; --accent: #89b4fa;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg); color: var(--text);
    margin: 0; padding: 16px;
  }
  nav.tabs {
    display: flex; gap: 6px; background: var(--panel);
    border-radius: 8px 8px 0 0; padding: 8px 12px 0; margin-bottom: 12px;
  }
  nav.tabs a {
    color: var(--muted); text-decoration: none; font-size: 14px; font-weight: bold;
    padding: 7px 18px; border-radius: 8px 8px 0 0;
  }
  nav.tabs a:hover { color: var(--text); background: var(--panel2); }
  nav.tabs a.active { color: #11111b; background: var(--accent); }
  .cols {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    height: calc(100vh - 110px); min-height: 320px;
  }
  @media (max-width: 1100px) { .cols { grid-template-columns: 1fr; height: auto; } }
  .block {
    background: var(--panel); border-radius: 8px; padding: 8px 10px;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .block .head { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .block .head b { color: var(--accent); }
  .block iframe {
    flex: 1; width: 100%; min-height: 300px;
    border: 1px solid var(--panel2); border-radius: 6px; background: var(--panel);
  }
</style>
</head>

  <a href="creds.html">Passwords</a>
</nav>

  <div class="block">
    <div class="head">PTZ live view</div>
    <iframe id="live" src="http://10.107.147.121/dashboard_shekmun.html" title="PTZ live view"></iframe>
  </div>
  <div class="block" id="sm02">
    <div class="head">SM02 tablet control</div>
    <iframe src="http://172.18.2.52:8000/tablet?max_col=4&max_row=2&min_col=0&pages=1" title="SM02 tablet"></iframe>
  </div>
</div>
</body>
</html>
